<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue background -->
  <rect width="800" height="500" rx="30" fill="#E8F1FF"/>

  <!-- Grid "snapshot" panel (zoomed in) -->
  <g>
    <!-- subtle shadow -->
    <defs>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
      </filter>
    </defs>

    <!-- Panel behind the grid -->
    <!-- 7 cols * 60 = 420, 6 rows * 60 = 360 -->
    <!-- Centered: x=190, y=70 -->
    <rect x="170" y="50" width="460" height="400" rx="22" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="4" filter="url(#softShadow)"/>

    <!-- Inner grid background -->
    <rect x="190" y="70" width="420" height="360" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Green solved cells (diagonal) -->
    <rect x="190" y="70"  width="60" height="60" fill="#86EFAC"/>
    <rect x="250" y="130" width="60" height="60" fill="#86EFAC"/>
    <rect x="310" y="190" width="60" height="60" fill="#86EFAC"/>
    <rect x="370" y="250" width="60" height="60" fill="#86EFAC"/>

    <!-- Grid lines -->
    <g stroke="#CBD5E1" stroke-width="2">
      <!-- vertical lines (inside) -->
      <path d="M250 70V430"/>
      <path d="M310 70V430"/>
      <path d="M370 70V430"/>
      <path d="M430 70V430"/>
      <path d="M490 70V430"/>
      <path d="M550 70V430"/>

      <!-- horizontal lines (inside) -->
      <path d="M190 130H610"/>
      <path d="M190 190H610"/>
      <path d="M190 250H610"/>
      <path d="M190 310H610"/>
      <path d="M190 370H610"/>
    </g>

    <!-- Letters (centered in each cell) -->
    <g
      fill="#0F1B2A"
      font-family="Arial, Helvetica, sans-serif"
      font-weight="700"
      font-size="34"
      text-anchor="middle"
      dominant-baseline="middle">>

      <!-- Row 1: G Q M A T L N -->
      <text x="220" y="100">G</text>
      <text x="280" y="100">Q</text>
      <text x="340" y="100">M</text>
      <text x="400" y="100">A</text>
      <text x="460" y="100">T</text>
      <text x="520" y="100">L</text>
      <text x="580" y="100">N</text>

      <!-- Row 2: B R H C W K O -->
      <text x="220" y="160">B</text>
      <text x="280" y="160">R</text>
      <text x="340" y="160">H</text>
      <text x="400" y="160">C</text>
      <text x="460" y="160">W</text>
      <text x="520" y="160">K</text>
      <text x="580" y="160">O</text>

      <!-- Row 3: V Y I R G Z T -->
      <text x="220" y="220">V</text>
      <text x="280" y="220">Y</text>
      <text x="340" y="220">I</text>
      <text x="400" y="220">R</text>
      <text x="460" y="220">G</text>
      <text x="520" y="220">Z</text>
      <text x="580" y="220">T</text>

      <!-- Row 4: E C P D M U H -->
      <text x="220" y="280">E</text>
      <text x="280" y="280">C</text>
      <text x="340" y="280">P</text>
      <text x="400" y="280">D</text>
      <text x="460" y="280">M</text>
      <text x="520" y="280">U</text>
      <text x="580" y="280">H</text>

      <!-- Row 5: J F X O D N R -->
      <text x="220" y="340">J</text>
      <text x="280" y="340">F</text>
      <text x="340" y="340">X</text>
      <text x="400" y="340">O</text>
      <text x="460" y="340">D</text>
      <text x="520" y="340">N</text>
      <text x="580" y="340">R</text>

      <!-- Row 6: A S V P H E K -->
      <text x="220" y="400">A</text>
      <text x="280" y="400">S</text>
      <text x="340" y="400">V</text>
      <text x="400" y="400">P</text>
      <text x="460" y="400">H</text>
      <text x="520" y="400">E</text>
      <text x="580" y="400">K</text>
    </g>
  </g>
</svg>
