<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="30" fill="#E8F1FF"/>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <!-- RED glow -->
    <filter id="redGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#FCA5A5" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- BLUE glow -->
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feFlood flood-color="#93C5FD" flood-opacity="0.85"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Panel -->
  <g>
    <rect x="170" y="50" width="460" height="400" rx="22"
          fill="#F8FAFC" stroke="#BFDBFE" stroke-width="4"
          filter="url(#softShadow)"/>

    <g transform="translate(85,75)">

      <!-- connectors -->
      <line x1="320" y1="68" x2="286" y2="122" stroke="#111827" stroke-width="6" stroke-linecap="round"/>
      <line x1="320" y1="68" x2="354" y2="122" stroke="#111827" stroke-width="6" stroke-linecap="round"/>

      <!-- black hole -->
      <circle cx="320" cy="68" r="24" fill="#111827"/>

      <!-- glowing nodes -->
      <g filter="url(#redGlow)">
        <circle cx="286" cy="122" r="22" fill="#FCA5A5" stroke="#7A1E1E" stroke-width="4"/>
      </g>
      <text x="286" y="128" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#7A1E1E">1</text>

      <g filter="url(#blueGlow)">
        <circle cx="354" cy="122" r="22" fill="#93C5FD" stroke="#1E3A8A" stroke-width="4"/>
      </g>
      <text x="354" y="128" text-anchor="middle" font-family="Arial" font-size="16" font-weight="800" fill="#1E3A8A">2</text>

      <!-- regular nodes -->
      <circle cx="252" cy="176" r="20" fill="#86EFAC" stroke="#000" stroke-width="3"/>
      <text x="252" y="182" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#14532D">3</text>

      <circle cx="320" cy="176" r="20" fill="#FCA5A5" stroke="#000" stroke-width="3"/>
      <text x="320" y="182" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#7A1E1E">4</text>

      <circle cx="388" cy="176" r="20" fill="#93C5FD" stroke="#000" stroke-width="3"/>
      <text x="388" y="182" text-anchor="middle" font-family="Arial" font-size="15" font-weight="800" fill="#1E3A8A">5</text>

      <circle cx="218" cy="228" r="18" fill="#BFDBFE" stroke="#000" stroke-width="3"/>
      <text x="218" y="234" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#1E40AF">6</text>

      <circle cx="286" cy="228" r="18" fill="#FECACA" stroke="#000" stroke-width="3"/>
      <text x="286" y="234" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#7F1D1D">7</text>

      <circle cx="354" cy="228" r="18" fill="#BBF7D0" stroke="#000" stroke-width="3"/>
      <text x="354" y="234" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#064E3B">8</text>

      <circle cx="422" cy="228" r="18" fill="#BFDBFE" stroke="#000" stroke-width="3"/>
      <text x="422" y="234" text-anchor="middle" font-family="Arial" font-size="14" font-weight="800" fill="#1E40AF">9</text>

      <!-- title -->
      <text x="320" y="318" text-anchor="middle" fill="#0F172A"
            font-size="34" font-family="Arial" font-weight="700">
        Black Hole
      </text>
    </g>
  </g>
</svg>
